name: F2Fintech Chatbot Harnesses & Evals Gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  chatbot-harnesses:
    name: Guardrails, RBAC, MCP, Routing & Eval Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all server modules
        run: npm run lint:syntax

      - name: Verify non-bypassable guardrail & RBAC integrity
        run: npm run verify:harnesses

      - name: Run offline fintech guardrail, RBAC, MCP, router & navigation evals
        env:
          EVAL_OFFLINE_ONLY: "true"
        run: npm run eval:chatbot

